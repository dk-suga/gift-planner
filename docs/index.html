function people(){let arr=db.people.filter(x=>(x.name+' '+(x.category||'')+' '+(x.tags||'')+' '+(x.interests||'')).toLowerCase().includes(search.toLowerCase()));return layout('Мои люди','Близкие, их интересы, даты и история подарков.',`<div class="toolbar"><input class="field" data-search placeholder="Найти человека…" value="${escapeHtml(search)}"><div class="toolbar-spacer"></div>${viewSwitch('people')}</div><div class="${db.views.people==='list'?'list-layout':'grid'}">${arr.map(p=>`<div class="card clickable" data-person="${p.id}"><div class="item"><div class="avatar">${escapeHtml(p.name[0]||'♡')}</div><div class="item-main"><strong>${escapeHtml(p.name)} ${p.category==='Близкий круг'?'<span class="chip favorite-tag">★ Близкий круг</span>':''}</strong><span class="muted small">${p.category==='Близкий круг'?(p.group?escapeHtml(p.group):''):(escapeHtml(p.category==='Друзья'?'Хорошие знакомые':(p.category||'Без категории'))+(p.group?' · '+escapeHtml(p.group):''))}</span></div><span class="go">Открыть →</span></div><div class="person-detail" style="margin-top:12px"><div class="muted small">${p.birthday?'🎂 '+(p.birthdayYearKnown===false?new Date(p.birthday+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'}):datefmt(p.birthday)):'День рождения не указан'}</div><div style="margin-top:8px">${(p.interests||'').split(',').filter(Boolean).slice(0,3).map(x=>`<span class="chip">${escapeHtml(x.trim())}</span>`).join(' ')}</div></div></div>`).join('')}</div>${arr.length?'':`<div class="empty">Добавь первого человека. Внутри карточки будут предпочтения, даты, идеи и история.</div>`}`,`<button class="btn" data-new="people">+ Человек</button>`)}
function profileHtml(){let p=byId('people',personDetailId);if(!p)return '';let gifts=db.gifts.filter(g=>g.personId===p.id||(Array.isArray(g.recipientIds)?g.recipientIds:(g.recipientIds||'').split(',')).includes(p.id));let ideas=gifts.filter(g=>g.status==='idea'),planned=gifts.filter(g=>g.status!=='idea'&&g.status!=='given'),history=gifts.filter(g=>g.status==='given');let notes=db.personNotes.filter(n=>n.personId===p.id).sort((a,b)=>String(b.date).localeCompare(String(a.date)));let liked=[p.interests,p.likes].filter(Boolean).join(', '),chips=liked.split(',').map(x=>x.trim()).filter(Boolean);let extra=p.extraDetails||p.customFields||'';
let summary=`<div class="profile-summary"><div class="avatar">${escapeHtml(p.name?.[0]||'♡')}</div><div><h2 style="margin:0">${escapeHtml(p.name)} ${p.category==='Близкий круг'?'<span class="chip favorite-tag">★ Близкий круг</span>':''}</h2><span class="muted small">${escapeHtml([p.category==='Близкий круг'?'':p.category,p.group].filter(Boolean).join(' · '))}</span></div></div>`;
let pane={overview:`<div class="profile-simple"><h3>Ближайшие даты</h3><p>${p.birthday?'🎂 День рождения · '+datefmt(p.birthday):'День рождения не указан'}</p>${db.events.filter(e=>e.personId===p.id).map(e=>`<p>${escapeHtml(e.name)} · ${datefmt(e.date)}</p>`).join('')}<div class="divider-lite"></div><h3>Что любит</h3><p>${escapeHtml(liked||'Пока ничего не добавлено')}</p>${p.dislikes?`<h3>Не дарить</h3><p>${escapeHtml(p.dislikes)}</p>`:''}<div class="divider-lite"></div><h3>Недавние заметки</h3>${notes.slice(0,2).map(n=>`<p class="small"><span class="muted">${escapeHtml(n.date||'')}</span> · ${escapeHtml(n.text)}</p>`).join('')||'<p class="muted small">Пока нет заметок.</p>'}<button class="btn secondary" data-newnote="${p.id}">+ Заметка</button></div>`,profile:`<div class="profile-simple"><h3>Интересы и предпочтения</h3><div class="interest-chips">${chips.map(t=>`<span class="chip">${escapeHtml(t)}</span>`).join('')||'<p class="muted">Пока ничего не добавлено</p>'}</div>${p.dislikes?`<h3>Чего избегать / не дарить</h3><p>${escapeHtml(p.dislikes)}</p>`:''}<div class="divider-lite"></div><h3>Полезные сведения</h3>${p.sizes?`<p><strong>Размеры и параметры:</strong> ${escapeHtml(p.sizes)}</p>`:''}${p.wishlist?`<p><strong>Вишлист:</strong> <a href="${safeUrl(p.wishlist)}" target="_blank" rel="noopener">Открыть ссылку ↗</a></p>`:''}${extra?`<p><strong>Дополнительная информация:</strong> ${escapeHtml(extra)}</p>`:''}${!p.sizes&&!p.wishlist&&!extra?'<p class="muted">Дополнительной информации пока нет.</p>':''}</div>`,dates:`<div class="profile-simple"><h3>Личные даты</h3><p>🎂 ${p.birthday?datefmt(p.birthday):'День рождения не указан'}</p>${db.events.filter(e=>e.personId===p.id).map(e=>`<p>${escapeHtml(e.name)} · ${datefmt(e.date)}</p>`).join('')}<button class="btn secondary" data-person-event="${p.id}">+ Добавить дату</button></div>`,gifts:`<div class="profile-simple"><h3>Запланированные подарки</h3>${planned.map(g=>`<div class="checkrow"><div class="item-main"><strong>${escapeHtml(g.name)}</strong><span class="muted small">${escapeHtml(eventName(byId('events',g.eventId)))}</span></div><span class="pill">${statusName(g.status)}</span><button class="linklike" data-edit="gifts:${g.id}">Изменить</button></div>`).join('')||'<p class="muted small">Пока нет запланированных подарков.</p>'}<div class="divider-lite"></div><h3>Идеи для подарков</h3>${ideas.map(g=>`<div class="checkrow"><div class="item-main"><strong>${escapeHtml(g.name)}</strong><span class="muted small">Свободная идея</span></div><button class="btn secondary" data-promote="${g.id}">Выбрать →</button></div>`).join('')||'<p class="muted small">Пока нет идей.</p>'}<button class="btn secondary" data-person-gift="${p.id}">+ Подарок или идея</button></div>`,history:`<div class="profile-simple"><h3>История подарков</h3>${history.map(g=>`<p>${escapeHtml(g.name)} · ${escapeHtml(eventName(byId('events',g.eventId)))}</p>`).join('')||'<p class="muted">Пока ничего не вручено.</p>'}</div>`,notes:`<div class="profile-simple"><div class="row between"><h3>Заметки</h3><button class="btn secondary" data-newnote="${p.id}">+ Заметка</button></div>${notes.map(n=>`<div class="note-item"><div class="row between"><span class="muted small">${escapeHtml(n.date||'')}</span><button class="linklike" data-noteidea="${n.id}">→ В идею</button></div><p>${escapeHtml(n.text)}</p></div>`).join('')||'<p class="muted">Заметок пока нет.</p>'}</div>`};return `<div class="modal-bg" data-profile-bg><div class="modal profile-modal"><div class="row between">${summary}<button class="btn ghost" data-profile-close aria-label="Закрыть">✕</button></div><div class="profile-tabs">${[['overview','Обзор'],['profile','О человеке'],['dates','Даты'],['gifts','Подарки'],['notes','Заметки'],['history','История']].map(([k,n])=>`<button class="${personTab===k?'active':''}" data-ptab="${k}">${n}</button>`).join('')}</div>${pane[personTab]||pane.overview}<div class="modal-actions"><button class="btn secondary" data-edit-person="${p.id}">Редактировать</button><button class="btn" data-profile-close>Закрыть</button></div></div></div>`}
function safeUrl(s){try{let u=new URL(s);return ['https:','http:'].includes(u.protocol)?escapeHtml(u.href):'#'}catch{return '#'}}
function holidayHtml(){const presets=[['newyear','Новый год','01-01'],['christmas7','Рождество (7 января)','01-07'],['christmas25','Рождество (25 декабря)','12-25'],['valentine','День святого Валентина','02-14'],['feb23','23 Февраля','02-23'],['march8','8 Марта','03-08'],['mother_ru','День матери (Россия)','moving-mother'],['father_ru','День отца (Россия)','moving-father'],['teacher','День учителя (Россия)','10-05']];return `<div class="modal-bg"><div class="modal"><div class="row between"><h2>Стандартные праздники</h2><button class="btn ghost" data-holiday-close>✕</button></div><p class="muted small">Выбери праздники, которые хочешь видеть в календаре. Уже добавленные отмечены.</p><form id="holiday-form">${presets.map(([key,n,d])=>{let exists=db.events.some(e=>e.catalogId===key||e.name===n);return `<label class="checkrow"><input type="checkbox" name="holiday" value="${key}" ${exists?'checked disabled':''}><span>${escapeHtml(n)}</span></label>`}).join('')}<div class="modal-actions"><button class="btn secondary" type="button" data-holiday-close>Отмена</button><button class="btn" type="submit">Добавить выбранные</button></div></form></div></div>`}
function holidayDate(key,year){const fixed={newyear:'01-01',christmas7:'01-07',christmas25:'12-25',valentine:'02-14',feb23:'02-23',march8:'03-08',teacher:'10-05'};if(fixed[key])return `${year}-${fixed[key]}`;const lastSunday=(m)=>{let dt=new Date(year,m+1,0);dt.setDate(dt.getDate()-dt.getDay());return dt};const thirdSunday=(m)=>{let dt=new Date(year,m,1);dt.setDate(1+(7-dt.getDay())%7+14);return dt};let dt=key==='mother_ru'?lastSunday(10):thirdSunday(9);return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`}
function applyHolidayCatalog(form){const catalog={newyear:'Новый год',christmas7:'Рождество (7 января)',christmas25:'Рождество (25 декабря)',valentine:'День святого Валентина',feb23:'23 Февраля',march8:'8 Марта',mother_ru:'День матери (Россия)',father_ru:'День отца (Россия)',teacher:'День учителя (Россия)'};const y=new Date().getFullYear();const chosen=[...form.querySelectorAll('input[name="holiday"]:checked:not(:disabled)')].map(x=>x.value);if(!chosen.length){alert('Отметь хотя бы один праздник, который ещё не добавлен.');return}chosen.forEach(k=>{const n=catalog[k];if(n&&!db.events.some(e=>e.catalogId===k||e.name===n))db.events.push({id:id(),name:n,catalogId:k,date:holidayDate(k,y),repeat:'yearly',type:'general'})});holidayChooser=false;draw()}
function viewSwitch(k){return `<div class="view-toggle"><button class="${db.views[k]==='grid'?'active':''}" data-view="${k}:grid" title="Сетка">▦</button><button class="${db.views[k]==='list'?'active':''}" data-view="${k}:list" title="Список">☷</button></div>`}
function calendar(){let first=new Date(calYear,calMonth,1),offset=(first.getDay()+6)%7,days=new Date(calYear,calMonth+1,0).getDate(),cells=Array.from({length:Math.ceil((offset+days)/7)*7},(_,i)=>i-offset+1);let monthName=first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});let period=db.events.filter(e=>{for(let d=1;d<=days;d++)if(hasDate(e,calYear,calMonth,d))return true;return false});return layout('Календарь','Все праздники и личные даты — даже без подарочного плана.',`<div class="row" style="margin-bottom:12px"><button class="btn secondary" data-default-events>+ Каталог стандартных праздников</button></div><div class="card"><div class="row between" style="margin-bottom:14px"><button class="btn ghost" data-month="-1">←</button><h2 style="margin:0;text-transform:capitalize">${monthName}</h2><button class="btn ghost" data-month="1">→</button></div><div class="calendar">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(s=>`<div class="weekday">${s}</div>`).join('')}${cells.map(d=>{let evs=db.events.filter(e=>d>0&&d<=days&&hasDate(e,calYear,calMonth,d));let td=new Date();return `<div class="day ${d<1||d>days?'other':''} ${td.getDate()===d&&td.getMonth()===calMonth&&td.getFullYear()===calYear?'today':''}"><strong>${d>0&&d<=days?d:''}</strong><div>${evs.slice(0,4).map(e=>`<span class="dot ${e.type==='personal'?'personal':''}" title="${escapeHtml(e.name)}"></span>`).join('')}</div>${evs.slice(0,2).map(e=>`<div class="event-tiny">${escapeHtml(e.name)}</div>`).join('')}</div>`}).join('')}</div></div><div class="section"><h2>События месяца</h2></div>${period.length?`<div class="grid two">${period.map(e=>`<div class="card clickable" data-occasion="${e.id}"><div class="row between"><strong>${escapeHtml(e.name)}</strong><span class="pill">${e.repeat==='yearly'?'Ежегодно':'Разовое'}</span></div><p class="muted small">${datefmt(`${calYear}-${e.date.slice(5)}`)} · ${escapeHtml(e.type==='personal'?'Личная дата':'Общий праздник')}</p></div>`).join('')}</div>`:`<div class="empty">В этом месяце событий пока нет.</div>`}`,`<button class="btn" data-new="events">+ Событие</button>`)}
function statusName(s){return {idea:'Идея',planned:'Запланирован',making:'В подготовке',ready:'Готов',given:'Вручён'}[s]||s}
function bundleTotal(g){return db.bundleItems.filter(x=>x.giftId===g.id).reduce((a,x)=>a+(+x.cost||0),0)}
function bundleReady(g){let x=db.bundleItems.filter(i=>i.giftId===g.id);return x.length?x.filter(i=>i.status==='ready').length+'/'+x.length:'Нет элементов'}
function gifts(){let arr=db.gifts.filter(g=>(giftFilter==='all'||g.status===giftFilter)&&(g.name+' '+personName(byId('people',g.personId))).toLowerCase().includes(search.toLowerCase()));return layout('Подарки и идеи','Идеи, готовые подарки и составные наборы.',`<div class="toolbar"><input class="field" data-search placeholder="Поиск по подаркам…" value="${escapeHtml(search)}"><select class="field select-inline" data-filter><option value="all">Все статусы</option>${['idea','planned','making','ready','given'].map(x=>`<option value="${x}" ${giftFilter===x?'selected':''}>${statusName(x)}</option>`).join('')}</select><div class="toolbar-spacer"></div>${viewSwitch('gifts')}</div><div class="${db.views.gifts==='list'?'list-layout':'grid'}">${arr.map(g=>`<div class="card"><div class="item"><div class="avatar">${g.type==='handmade'?'✂':g.type==='bundle'?'🎁':g.type==='experience'?'✦':'◇'}</div><div class="item-main"><strong>${escapeHtml(g.name)}</strong><span class="muted small">${escapeHtml(personName(byId('people',g.personId)))}</span></div><span class="pill">${statusName(g.status)}</span></div><div style="margin-top:12px"><span class="muted small">${escapeHtml(eventName(byId('events',g.eventId)))} · ${fmt(g.budget)}</span>${g.type==='bundle'?`<div class="muted small" style="margin:8px 0">Состав: ${bundleReady(g)} · сумма ${fmt(bundleTotal(g))}</div>`:''}</div><div class="progress"><div style="width:${giftPercent(g)}%"></div></div><div class="row wrap" style="margin-top:12px">${g.type==='bundle'?`<button class="btn secondary" data-bundle="${g.id}">Состав набора</button>`:g.type==='handmade'?`<button class="btn secondary" data-work="${g.id}">Мастерская</button>`:''}<button class="btn ghost" data-edit="gifts:${g.id}">Изменить</button></div></div>`).join('')}</div>${arr.length?'':`<div class="empty">Сохрани первую идею или запланируй подарок.</div>`}`,`<button class="btn" data-new="gifts">+ Подарок</button>`) }
function shopping(){let total=db.shopping.filter(x=>!x.done).reduce((a,x)=>a+(+x.cost||0),0);return layout('Покупки','Единый список для подарков, упаковки и материалов.',`<div class="grid two">${stat(db.shopping.filter(x=>!x.done).length,'Позиций купить',navIcon('shopping'))}${stat(fmt(total),'Планируемые траты','₽')}</div><div class="section"><h2>Список покупок</h2></div><div class="card">${db.shopping.length?db.shopping.map(x=>`<div class="checkrow ${x.done?'done':''}"><input type="checkbox" data-shopcheck="${x.id}" ${x.done?'checked':''}><div class="item-main"><strong>${escapeHtml(x.name)}</strong><span class="muted small">${escapeHtml(x.quantity||'')} · ${escapeHtml(byId('gifts',x.giftId)?.name||'Общая покупка')}</span></div><span>${fmt(x.cost)}</span><button class="subtle-btn" data-edit="shopping:${x.id}">✎</button></div>`).join(''):`<div class="empty">Пока ничего не нужно покупать.</div>`}</div>`,`<button class="btn" data-new="shopping">+ Покупка</button>`)}
function workshop(){
 const handmade=db.gifts.filter(g=>g.type==='handmade');
 const parts=db.bundleItems.filter(x=>x.type==='handmade');
 const all=[...handmade.map(g=>({id:g.id,kind:'gift',name:g.name,person:personName(byId('people',g.personId)),status:g.status})),...parts.map(x=>({id:x.id,kind:'part',name:x.name,person:byId('gifts',x.giftId)?.name||'Сборный подарок',status:x.status}))];
 return layout('Мастерская','Все handmade-проекты, материалы, сроки и прогресс.',`<div class="row wrap quick-links"><button class="btn" data-new="gifts:handmade">+ Handmade-проект</button><button class="btn secondary" data-new="materials">+ Материал</button><button class="btn secondary" data-nav="shopping">Покупки →</button></div><div class="grid two">${stat(all.filter(x=>x.status!=='given').length,'Творческих проектов',navIcon('workshop'))}${stat(db.materials.length,'Материалов дома',navIcon('shopping'))}</div><div class="section"><h2>Активные проекты</h2></div>${all.length?`<div class="grid two">${all.map(g=>{const steps=db.steps.filter(s=>s.giftId===g.id);const sum=steps.reduce((a,x)=>a+(Number(x.weight)||1),0),done=steps.filter(x=>x.done).reduce((a,x)=>a+(Number(x.weight)||1),0),pct=sum?Math.round(done/sum*100):0;return `<div class="card workshop-card"><div class="row between"><strong>${escapeHtml(g.name)}</strong><span class="pill">${g.kind==='part'?'Элемент набора':'Handmade'}</span></div><p class="muted small">${escapeHtml(g.person||'Без получателя')} · ${steps.filter(x=>x.done).length} из ${steps.length} этапов</p><div class="progress"><div style="width:${pct}%"></div></div><div class="row between"><span class="muted small">${pct}% готово</span><button class="btn secondary" data-work="${g.id}">Открыть проект →</button></div></div>`}).join('')}</div>`:`<div class="empty">Мастерская пока пустая. Создай handmade-проект или добавь handmade-элемент в сборный подарок.</div>`}<div class="section"><h2>Материалы дома</h2><button class="btn secondary" data-new="materials">+ Материал</button></div><div class="card">${db.materials.length?db.materials.map(x=>`<div class="checkrow"><div class="avatar" style="width:35px;height:35px;font-size:17px">◈</div><div class="item-main"><strong>${escapeHtml(x.name)}</strong><span class="muted small">В наличии: ${escapeHtml(x.amount||'0')} ${escapeHtml(x.unit||'шт.')}</span></div><button class="subtle-btn" data-edit="materials:${x.id}">Изменить</button></div>`).join(''):`<p class="muted small">Пряжа, воск, фитили и другие материалы, которые уже есть дома.</p>`}</div>`)

function gpNextEventYear(event){

 if(!/^\d{2}-\d{2}$/.test(d))return current;
 return `${current}-${d}`<today?current+1:current;
}

 {key:'confirm',title:'Проверить заказы и материалы',dueDate:isoShift(delivery,-(maxMaking+s.buffer+s.shipping)),kind:'plan'}];
 for(const p of projects){

     items.push({key:'project:'+p.projectId+':buy',title:'Заказать / купить: '+title,dueDate:isoShift(deadline,-(ship+buff)),kind:'shopping',projectId:p.projectId});
   }else if(p.type==='experience'){
     items.push({key:'project:'+p.projectId+':book',title:'Забронировать: '+title,dueDate:isoShift(deadline,-Math.max(lead,ship+buff)),kind:'booking',projectId:p.projectId});
   }

}

function v16NormalizeCategory(text){

}

    for(const node of [...header.querySelectorAll('.v14-profile-tag,.v14-category,span,small')]){

function v16EventMonthDay(e){
  if(!e) return '';
  const raw = e.catalogId && ['mother_ru','father_ru'].includes(e.catalogId) ? holidayDate(e.catalogId, new Date().getFullYear()) : (e.date||'');
  if(!raw) return '';
  const parts = String(raw).split('-');
  return parts.length>=3 ? parts[1]+'-'+parts[2] : '';
}
function v16EventKey(e){
  if(!e) return '';
  if(e.catalogId) return 'catalog:'+e.catalogId;
  return [String(e.type||'other').toLowerCase(), String(e.name||'').trim().toLowerCase(), v16EventMonthDay(e)].join('|');
}
function v16GiftYear(g, fallback){
  const linked = byId('events', g.eventId);
  return Number(g.eventYear || linked?.date?.slice(0,4) || fallback || new Date().getFullYear());
}
function v16GiftsForOccasion(event, year){
  const currentKey = v16EventKey(event);
  return db.gifts.filter(g=>{
    if(g.archived || g.inventoryState==='stock' || g.status==='idea') return false;
    if(v16GiftYear(g, year)!==Number(year)) return false;
    if(g.eventId===event.id) return true;
    const linked = byId('events', g.eventId);
    return !!linked && v16EventKey(linked)===currentKey;
  });
}
function v16IdeasForOccasion(event, year){
  const currentKey = v16EventKey(event);
  return db.gifts.filter(g=>{
    if(g.archived || g.inventoryState==='stock' || g.status!=='idea') return false;
    if(v16GiftYear(g, year)!==Number(year)) return false;
    if(g.eventId===event.id) return true;
    const linked = byId('events', g.eventId);
    return !!linked && v16EventKey(linked)===currentKey;
  });
}

// TickTick: all integration-related operations are local until a secure OAuth endpoint exists.
// Never claim to have synced remotely. Export reproducible IDs for future mapping.
let v17TickSelected=new Set();
const v17TickCandidates=()=>{
 const entries=[];
 for(const plan of db.occasionPlans){
  if(plan.done||plan.mode==='simple')continue;
  const event=byId('events',plan.eventId);if(!event)continue;
  for(const task of syncPlanTasks(plan,event)){
   if(task.done)continue;
   entries.push({id:'plan:'+task.id,title:task.title||task.name||'Задача',date:task.dueDate||task.date||'',detail:`${event.name} · ${plan.year} · ${task.kind||'подготовка'}`,kind:'plan'});
  }
 }
 for(const x of db.shopping){
  if(x.done||!x.dueDate)continue;
  entries.push({id:'shopping:'+x.id,title:'Купить: '+(x.name||'Покупка'),date:x.dueDate,detail:'Список покупок подарков',kind:'shopping'});
 }
 const seen=new Set();return entries.filter(x=>{if(seen.has(x.id))return false;seen.add(x.id);return true}).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
};
const v17TickSection=()=>{
 const tasks=v17TickCandidates();
 if(!tasks.length) return '<p class="muted small">Задач со сроками пока нет. Создай подробный план праздника или покупку с дедлайном.</p>';
 const available=new Set(tasks.map(t=>t.id));v17TickSelected=new Set([...v17TickSelected].filter(id=>available.has(id)));
 return `<div class="v17-tick-actions"><button type="button" class="btn secondary" data-v17-tick-all>Выбрать все</button><button type="button" class="btn ghost" data-v17-tick-none>Снять выбор</button></div><div class="v17-tick-list">${tasks.map(t=>`<label><input type="checkbox" data-v17-tick-check="${escapeHtml(t.id)}" ${v17TickSelected.has(t.id)?'checked':''}><span><strong>${escapeHtml(t.title)}</strong><small>${escapeHtml(t.date||'Без даты')} · ${escapeHtml(t.detail)}</small></span></label>`).join('')}</div><div class="v17-tick-actions"><button type="button" class="btn" data-v17-tick-ics>↓ Скачать календарный файл</button><button type="button" class="btn secondary" data-v17-tick-copy>Скопировать выбранные</button></div>`;
};
const oldSettingsV17=settings;
settings=function(){
 let html=oldSettingsV17();
 // Replace historical 'copy tasks' widget, leaving a single clearly labelled integration section.
 html=html.replace(/<section class="v12-settings-section"><h3>TickTick · ручная передача задач<\/h3>[\s\S]*?<\/section>/,'');
 const panel=`<section class="v12-settings-section v17-tick-settings"><h3>TickTick · подготовка задач</h3><p class="muted small">Отмечай только нужные задачи. Календарный файл можно импортировать через TickTick на сайте; способ обработки задач зависит от версии TickTick. Прямого подключения к твоему аккаунту пока нет: ничего не отправляется без твоего действия.</p>${v17TickSection()}<p class="muted small">После подключения облака добавим OAuth, сохранение внешних ID и защиту от повторной отправки. Не вводи токены TickTick в HTML-файл.</p></section>`;
 return html.replace('<div class="v12-settings-foot">',panel+'<div class="v12-settings-foot">');
};
function v17Download(name,content,mime){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type:mime}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function v17IcsEscape(value){return String(value||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function v17TickExport(asIcs){
 const tasks=v17TickCandidates().filter(x=>v17TickSelected.has(x.id));
 if(!tasks.length){window.v14Toast?.('Сначала выбери хотя бы одну задачу.');return}
 if(asIcs){
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Gift Planner//RU//EN','CALSCALE:GREGORIAN'];
  for(const t of tasks){lines.push('BEGIN:VTODO','UID:'+v17IcsEscape(t.id.replace(':','-'))+'@gift-planner.local','DTSTAMP:'+stamp,'SUMMARY:'+v17IcsEscape(t.title),'DESCRIPTION:'+v17IcsEscape(t.detail),'STATUS:NEEDS-ACTION');if(/^\d{4}-\d{2}-\d{2}$/.test(t.date))lines.push('DUE;VALUE=DATE:'+t.date.replace(/-/g,''));lines.push('END:VTODO')}
  lines.push('END:VCALENDAR');v17Download('gift-planner-ticktick-'+v17Today()+'.ics',lines.join('\r\n')+'\r\n','text/calendar;charset=utf-8');
 } else {
  const text=tasks.map(x=>`${x.date||'Без даты'} — ${x.title} (${x.detail})`).join('\n');
  if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>window.v14Toast?.(`Скопировано задач: ${tasks.length}`)).catch(()=>v17Download('gift-planner-ticktick.txt',text,'text/plain;charset=utf-8'))}
  else v17Download('gift-planner-ticktick.txt',text,'text/plain;charset=utf-8');
 }
}
const oldFormModalV17=formModal;
formModal=function(){

 }
 return html;

document.addEventListener('submit',ev=>{
 if(ev.target.id!=='v17-expense-form')return;ev.preventDefault();ev.stopImmediatePropagation();

 if(!v17ExpenseEditId)db.expenses.push(saved);v17ExpenseEditId=null;modal=null;page='statistics';draw();window.v14Toast?.('✓ Расход сохранён в финансовом реестре.');
},true);
